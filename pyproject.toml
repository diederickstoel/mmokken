[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mmokken"
version = "0.1.0.dev0"
description = "Multidimensional non-parametric measurement models in Python (Track B of the mMokken research programme)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Diederick Stoel" },
]
keywords = [
    "mokken",
    "scale analysis",
    "item response theory",
    "psychometrics",
    "multidimensional",
    "non-parametric",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.7",
]
test = [
    "pytest>=8.0",
    "pyreadr>=0.5",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1",
    "myst-parser>=2.0",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/dstoel/mmokken"
Repository = "https://github.com/dstoel/mmokken"
Issues = "https://github.com/dstoel/mmokken/issues"
Documentation = "https://mmokken.readthedocs.io"

[tool.hatch.build.targets.wheel]
packages = ["src/mmokken"]

[tool.hatch.build.targets.sdist]
include = [
    "src/mmokken",
    "tests",
    "docs",
    "README.md",
    "migration_journal.md",
    "migration_report.md",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
ignore_missing_imports = true
files = ["src/mmokken"]
